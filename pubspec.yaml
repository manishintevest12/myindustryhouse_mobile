name: myindustryhouse_mobile
description: >-
  MyIndustryHouse - native Flutter mobile client (Buyer & Seller panels only).
  Consumes the existing MyIndustryHouse REST API exactly as-is. No admin
  surface, no WebView: pure native widgets.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management: Riverpod (compile-safe, testable)
  flutter_riverpod: ^2.5.1
  # HTTP client for the existing REST APIs
  dio: ^5.5.0
  # Session token persistence
  shared_preferences: ^2.3.2
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
